<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b2118">
<meta name="description" content="BusKit — Bengaluru bus routes, fares, next departures and passes, in plain words.">
<title>BusKit — Bengaluru Bus, Sorted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#faf6ee;--paper2:#f3ecdd;--card:#fffdf7;--ink:#2b2118;--ink2:#6b5d4f;--line:#e5d9c3;--bronze:#b07d2b;--gold:#d9a441;--terra:#c05b2e;--terra-d:#9c4520;--green:#5f7a3a;--greenbg:#eef0e2;--red:#a83a2a;--redbg:#fbe9e4;--amberbg:#fdf3df;--shadow:0 10px 30px rgba(43,33,24,.10);--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif}
a{color:var(--terra-d)}
.wrap{max-width:1060px;margin:0 auto;padding:0 18px}
.muted{color:var(--ink2)}
.small{font-size:13px}
.hidden{display:none !important}
/* ---------- cinematic intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241a12,#3a2a1a 55%,#7a4a1e);color:#fbf3e2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;transition:opacity .6s ease,visibility .6s}
#intro.gone{opacity:0;visibility:hidden;pointer-events:none}
#intro .rays{position:absolute;inset:-40%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(217,164,65,.14) 0 6deg,transparent 6deg 18deg);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#intro .bus{width:120px;height:64px;position:relative;animation:roll 2.6s ease-in-out infinite}
@keyframes roll{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#intro .bus svg{width:100%;height:100%}
#intro .road{width:min(420px,80vw);height:4px;background:rgba(251,243,226,.25);border-radius:4px;overflow:hidden;position:relative}
#intro .road i{position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,#d9a441,transparent);animation:drive 1.4s linear infinite}
@keyframes drive{from{left:-40%}to{left:100%}}
#intro h1{font-size:clamp(38px,8vw,64px);font-weight:900;letter-spacing:.01em;opacity:0;animation:rise .8s .2s ease forwards}
#intro p{font-size:17px;opacity:0;animation:rise .8s .55s ease forwards;color:#e8d5ae}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#intro .prog{width:min(260px,70vw);height:5px;background:rgba(251,243,226,.22);border-radius:5px;overflow:hidden}
#intro .prog i{display:block;height:100%;width:0;background:#d9a441;border-radius:5px;transition:width .2s}
#intro .skip{position:absolute;bottom:26px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#e8d5ae;background:rgba(0,0,0,.25);border:1px solid rgba(251,243,226,.35);padding:9px 16px;border-radius:999px}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(250,246,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(140deg,#b07d2b,#c05b2e);display:grid;place-items:center;box-shadow:var(--shadow)}
.logo .mark svg{width:24px;height:24px}
.logo b{font-family:Fraunces,serif;font-size:22px;letter-spacing:.01em}
.logo span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{font-size:13.5px;font-weight:600;color:var(--ink2);text-decoration:none;padding:8px 10px;border-radius:999px}
.top nav a:hover{background:var(--paper2);color:var(--ink)}
.clock{margin-left:6px;font-size:13px;font-weight:700;background:var(--ink);color:#fbf3e2;padding:8px 12px;border-radius:999px;white-space:nowrap}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden}
.hero img{width:100%;height:min(58vh,460px);object-fit:cover;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.08) translateX(-1.2%)}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,12,6,.05) 40%,rgba(20,12,6,.72))}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:28px 22px 26px;color:#fdf8ee}
.hero .kicker{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#f2cd7e}
.hero h1{font-size:clamp(34px,6.4vw,58px);line-height:1.04;font-weight:900;margin:8px 0 8px;max-width:640px}
.hero p{max-width:560px;font-size:16.5px;color:#f3e8d2}
.hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{background:rgba(250,246,238,.16);border:1px solid rgba(250,246,238,.45);color:#fdf8ee;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;backdrop-filter:blur(4px)}
/* ---------- sections ---------- */
section.block{padding:30px 0 6px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:clamp(24px,3.6vw,32px);font-weight:700}
.sec-head .count{font-size:13px;color:var(--ink2);font-weight:600}
.sec-sub{color:var(--ink2);font-size:15px;max-width:720px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
/* ---------- departure board ---------- */
.board{background:#241a12;color:#f6ead2;border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid #4a3823}
.board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid rgba(246,234,210,.16)}
.board-head .dot{width:9px;height:9px;border-radius:50%;background:#e0a93e;box-shadow:0 0 0 0 rgba(224,169,62,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(224,169,62,0)}100%{box-shadow:0 0 0 0 rgba(224,169,62,0)}}
.board-head h3{font-size:19px;font-weight:700}
.board-head .live{font-size:11px;font-weight:800;letter-spacing:.16em;color:#f2cd7e;border:1px solid rgba(242,205,126,.5);padding:4px 8px;border-radius:999px}
.board-head select{margin-left:auto;background:#3a2a1a;color:#f6ead2;border:1px solid rgba(246,234,210,.3);border-radius:10px;padding:8px 10px;font-weight:600}
.board-rows{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:86px 1fr auto auto;gap:12px;align-items:center;padding:14px 18px;border-top:1px solid rgba(246,234,210,.10);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.brow:hover{background:rgba(246,234,210,.06)}
.brow .no{font-family:Fraunces,serif;font-size:22px;font-weight:900;color:#f2cd7e}
.brow .no small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.14em;color:#c9b48c;font-weight:700}
.brow .dest{font-weight:700;font-size:15.5px}
.brow .dest span{display:block;font-weight:500;font-size:12.5px;color:#c9b48c}
.brow .fare{font-weight:700;font-size:14px;text-align:right}
.brow .fare span{display:block;font-weight:500;font-size:12px;color:#c9b48c}
.brow .next{min-width:96px;text-align:center}
.brow .next b{font-size:19px;font-weight:800;color:#ffe9b0}
.brow .next span{display:block;font-size:11px;color:#c9b48c;font-weight:600}
.brow .next.ended b{color:#c98a6a;font-size:15px}
.board-foot{padding:12px 18px;border-top:1px solid rgba(246,234,210,.16);font-size:13px;color:#c9b48c;display:flex;gap:16px;flex-wrap:wrap}
.board-foot b{color:#f2cd7e}
/* ---------- finder ---------- */
.finder{display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.finder .side{padding:20px}
.finder .side+.side{border-left:1px solid var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.field select,.field input[type=text],.field input[type=number]{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;font-size:15px}
.field select:focus,.field input:focus{outline:2px solid var(--bronze);outline-offset:1px;border-color:var(--bronze)}
.swaprow{display:flex;gap:10px;align-items:center}
.swaprow .field{flex:1;margin-bottom:0}
.btn{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:14.5px;background:var(--ink);color:#fbf3e2;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.terra{background:var(--terra);color:#fff}
.btn.small{padding:9px 14px;font-size:13px}
.btn.block{width:100%}
.swap{flex:0 0 40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper2);display:grid;place-items:center;font-size:18px}
.results{display:flex;flex-direction:column;gap:12px}
.res{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.res.best{border-color:var(--bronze);background:linear-gradient(180deg,#fffdf7,#fdf6e7)}
.res .r-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res .r-no{font-family:Fraunces,serif;font-weight:900;font-size:19px;color:var(--terra-d)}
.res .r-arrow{color:var(--ink2);font-weight:700}
.res .r-via{font-size:13px;color:var(--ink2);font-weight:600}
.badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--amberbg);color:#8a5a12;border:1px solid #ecd9a8}
.badge.green{background:var(--greenbg);color:#4a6428;border-color:#d3ddba}
.badge.terra{background:#fbe9e4;color:var(--terra-d);border-color:#f2c9b8}
.res .r-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;color:var(--ink2)}
.res .r-meta b{color:var(--ink);font-size:15px}
.res .r-note{margin-top:8px;font-size:13px;background:var(--greenbg);border-radius:9px;padding:8px 10px;color:#43591f;font-weight:600}
.res .r-legs{margin-top:8px;font-size:13px;color:var(--ink2)}
.res .r-legs b{color:var(--ink)}
.empty{padding:26px 18px;text-align:center;color:var(--ink2)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
/* ---------- fare + passes ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel{padding:20px}
.panel h3{font-size:20px;margin-bottom:4px}
.panel .sub{font-size:13.5px;color:var(--ink2);margin-bottom:14px}
input[type=range]{width:100%;accent-color:var(--terra);height:28px}
.range-val{font-family:Fraunces,serif;font-size:34px;font-weight:900}
.range-val small{font-size:16px;font-family:Inter,sans-serif;font-weight:600;color:var(--ink2)}
.fare-out{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--amberbg);border:1px solid #ecd9a8;border-radius:14px;padding:14px 16px;margin-top:10px}
.fare-out .big{font-family:Fraunces,serif;font-size:40px;font-weight:900;line-height:1}
.fare-out .big small{font-size:15px;font-family:Inter,sans-serif;color:var(--ink2);font-weight:600}
.seg{display:flex;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fbf3e2}
.statline{display:flex;justify-content:space-between;font-size:14px;padding:9px 2px;border-top:1px dashed var(--line)}
.statline:first-of-type{border-top:0}
.statline b{font-size:15px}
.statline .win{color:var(--green);font-weight:800}
.pass-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.pass{border:1.5px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#fff}
.pass b{font-family:Fraunces,serif;font-size:19px;display:block}
.pass .p{font-size:22px;font-weight:800;margin:6px 0 2px}
.pass span{font-size:12.5px;color:var(--ink2)}
.pass.best{border-color:var(--bronze);background:linear-gradient(180deg,#fffdf7,#fdf6e7)}
/* ---------- saved + trips ---------- */
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.sav{flex:0 0 250px;scroll-snap-align:start;border:1.5px solid var(--line);border-radius:14px;padding:15px;background:#fff;text-align:left}
.sav:hover{border-color:var(--bronze)}
.sav .s-route{font-weight:800;font-size:15px}
.sav .s-meta{font-size:13px;color:var(--ink2);margin:5px 0 10px}
.sav .s-foot{display:flex;justify-content:space-between;align-items:center}
.star{border:0;background:none;font-size:20px;color:var(--bronze);line-height:1}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:10px 12px;border-bottom:1.5px solid var(--line)}
table.log td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.log td.r,table.log th.r{text-align:right}
.logwrap{overflow-x:auto}
/* ---------- news ---------- */
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.news article{border:1.5px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.news .tag{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-d)}
.news h3{font-size:17px;line-height:1.35;margin:7px 0 6px}
.news p{font-size:13.5px;color:var(--ink2)}
